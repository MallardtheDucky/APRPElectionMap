<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>2012 Live Election Command Center</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <!-- MapLibre -->
  <script src="https://unpkg.com/maplibre-gl@5/dist/maplibre-gl.js"></script>
  <link
    href="https://unpkg.com/maplibre-gl@5/dist/maplibre-gl.css"
    rel="stylesheet"
  />

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;900&display=swap"
    rel="stylesheet"
  />

  <!-- Icons -->
  <link
    rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
  />

  <!-- Confetti -->
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

  <style>

    :root {
      --gop-color: #e74c3c;
      --dem-color: #3498db;
      --ind-color: #9b59b6;

      --dark-bg: #0f172a;
      --panel-bg: rgba(31, 41, 55, 0.88);
      --border-color: rgba(255,255,255,0.1);

      --text-light: #f9fafb;
      --text-muted: #9ca3af;

      --winner-bg: #22c55e;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 0;
      font-family: 'Inter', sans-serif;
      background: var(--dark-bg);
      color: white;
      overflow: hidden;
    }

    .hidden {
      display: none !important;
    }

    /* =========================
       LOADER
    ========================= */

    #loader {
      position: absolute;
      inset: 0;

      background: rgba(15, 23, 42, 0.96);

      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;

      z-index: 5000;
    }

    .spinner {
      width: 42px;
      height: 42px;

      border: 4px solid rgba(255,255,255,0.15);
      border-left-color: var(--dem-color);

      border-radius: 50%;

      animation: spin 1s linear infinite;

      margin-bottom: 15px;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }

    /* =========================
       MAP
    ========================= */

    #map {
      position: absolute;
      inset: 0;
      z-index: 0;
    }

    /* =========================
       HEADER
    ========================= */

    #header {
      position: absolute;

      top: 0;
      left: 0;
      right: 0;

      z-index: 1000;

      padding: 12px 20px;

      background: var(--panel-bg);

      backdrop-filter: blur(12px);

      border-bottom: 1px solid var(--border-color);
    }

    .top-row {
      display: flex;
      justify-content: space-between;
      align-items: center;

      margin-bottom: 10px;
    }

    .title-group {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .title {
      font-size: 20px;
      font-weight: 900;
    }

    .live-badge {
      background: #ef4444;

      padding: 3px 7px;

      border-radius: 4px;

      font-size: 10px;
      font-weight: 900;

      animation: pulse 2s infinite;
    }

    @keyframes pulse {
      50% {
        opacity: 0.55;
      }
    }

    .header-controls {
      display: flex;
      gap: 8px;
    }

    .btn-icon {
      width: 34px;
      height: 34px;

      background: rgba(255,255,255,0.1);

      color: white;

      border: 1px solid var(--border-color);
      border-radius: 6px;

      cursor: pointer;
    }

    .btn-icon:hover {
      background: rgba(255,255,255,0.18);
    }

    /* =========================
       ELECTORAL BAR
    ========================= */

    .progress-container {
      width: 100%;
    }

    .progress-bar-container {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .candidate-image {
      width: 48px;
      height: 48px;

      border-radius: 50%;

      object-fit: cover;

      border: 2px solid rgba(255,255,255,0.25);
    }

    .progress-bar-wrapper {
      position: relative;

      width: 100%;
      height: 30px;

      background: rgba(0,0,0,0.35);

      overflow: hidden;

      border-radius: 15px;
    }

    .progress-bar {
      position: absolute;

      top: 0;
      height: 100%;

      transition: width 0.8s ease;
    }

    .progress-bar.gop {
      left: 0;
      background: var(--gop-color);
    }

    .progress-bar.dem {
      right: 0;
      background: var(--dem-color);
    }

    .threshold-marker {
      position: absolute;

      left: calc(270 / 538 * 100%);

      width: 2px;
      height: 100%;

      background: white;

      z-index: 5;
    }

    .bar-label {
      position: absolute;

      top: 50%;

      transform: translateY(-50%);

      z-index: 10;

      font-size: 13px;
      font-weight: 900;
    }

    .candidate-stats {
      display: flex;

      justify-content: space-between;

      margin-top: 6px;

      font-size: 12px;

      color: var(--text-muted);
    }

    .stat-group {
      display: flex;
      gap: 10px;
    }

    /* =========================
       SIDEBAR
    ========================= */

    #sidebar {
      position: absolute;

      top: 0;
      right: -320px;
      bottom: 35px;

      width: 300px;

      background: rgba(15, 23, 42, 0.98);

      z-index: 3000;

      border-left: 1px solid var(--border-color);

      transition: right 0.3s ease;

      display: flex;
      flex-direction: column;
    }

    #sidebar.open {
      right: 0;
    }

    .sidebar-header {
      display: flex;
      justify-content: space-between;
      align-items: center;

      padding: 15px;

      border-bottom: 1px solid var(--border-color);
    }

    .sidebar-title {
      font-weight: 800;
      text-transform: uppercase;
    }

    .close-sidebar {
      background: none;
      border: none;

      color: white;

      font-size: 20px;

      cursor: pointer;
    }

    .search-container {
      padding: 12px;
    }

    .search-input {
      width: 100%;

      padding: 9px 12px;

      background: rgba(255,255,255,0.07);

      border: 1px solid var(--border-color);

      border-radius: 6px;

      color: white;
    }

    .state-list {
      margin: 0;
      padding: 0;

      list-style: none;

      overflow-y: auto;

      flex: 1;
    }

    .state-item {
      display: flex;

      justify-content: space-between;
      align-items: center;

      padding: 12px 15px;

      border-bottom: 1px solid var(--border-color);

      cursor: pointer;
    }

    .state-item:hover {
      background: rgba(255,255,255,0.06);
    }

    .state-name {
      display: block;

      font-weight: 700;
    }

    .state-meta {
      font-size: 11px;

      color: var(--text-muted);

      margin-top: 3px;
    }

    .state-margin {
      padding: 4px 7px;

      border-radius: 4px;

      font-size: 12px;
      font-weight: 800;
    }

    .margin-gop {
      color: #ffaaaa;
      background: rgba(231,76,60,0.2);
    }

    .margin-dem {
      color: #aaddff;
      background: rgba(52,152,219,0.2);
    }

    .margin-tossup {
      color: white;
      background: rgba(149,165,166,0.2);
    }

    /* =========================
       LEGEND
    ========================= */

    #legend-btn {
      position: absolute;

      left: 15px;
      bottom: 50px;

      z-index: 1000;

      background: var(--panel-bg);

      color: white;

      border: 1px solid var(--border-color);

      padding: 8px 12px;

      border-radius: 6px;

      cursor: pointer;
    }

    #legend-panel {
      position: absolute;

      left: 15px;
      bottom: 92px;

      width: 170px;

      z-index: 1000;

      display: none;

      padding: 12px;

      background: var(--panel-bg);

      border: 1px solid var(--border-color);

      border-radius: 8px;
    }

    #legend-panel.show {
      display: block;
    }

    .legend-item {
      display: flex;
      align-items: center;

      margin: 6px 0;

      font-size: 11px;
    }

    .legend-dot {
      width: 11px;
      height: 11px;

      margin-right: 8px;

      border-radius: 2px;
    }

    /* =========================
       WINNER
    ========================= */

    #winner-banner {
      position: absolute;

      top: -100px;
      left: 50%;

      transform: translateX(-50%);

      z-index: 2000;

      padding: 12px 35px;

      background: var(--winner-bg);

      font-weight: 900;

      transition: top 0.5s ease;
    }

    /* =========================
       TICKER
    ========================= */

    #ticker-bar {
      position: absolute;

      bottom: 0;
      left: 0;
      right: 0;

      height: 35px;

      display: flex;
      align-items: center;

      z-index: 2000;

      background: #0f172a;

      border-top: 1px solid var(--border-color);

      overflow: hidden;
    }

    .ticker-label {
      height: 100%;

      display: flex;
      align-items: center;

      padding: 0 15px;

      background: var(--gop-color);

      font-size: 12px;
      font-weight: 900;
    }

    .ticker-wrap {
      flex: 1;
      overflow: hidden;
    }

    .ticker-content {
      display: flex;

      white-space: nowrap;

      animation: ticker 40s linear infinite;

      padding-left: 20px;
    }

    .ticker-item {
      margin-right: 40px;

      font-size: 13px;

      color: #cbd5e1;
    }

    @keyframes ticker {
      from {
        transform: translateX(0);
      }

      to {
        transform: translateX(-100%);
      }
    }

    /* =========================
       MAPLIBRE POPUPS
    ========================= */

    .maplibregl-popup-content {
      background: rgba(15,23,42,0.98) !important;

      color: white !important;

      padding: 0 !important;

      border: 1px solid var(--border-color);

      border-radius: 10px;

      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
    }

    .maplibregl-popup-close-button {
      color: white !important;
      font-size: 20px;
    }

    .popup-header {
      padding: 12px 16px;

      background: rgba(255,255,255,0.05);

      border-bottom: 1px solid var(--border-color);
    }

    .popup-header h3 {
      margin: 0;
    }

    .popup-body {
      padding: 14px;
    }

    .candidate-row {
      display: flex;

      align-items: center;

      padding: 8px;

      margin-bottom: 7px;

      background: rgba(255,255,255,0.03);

      border-radius: 7px;
    }

    .candidate-row.winner {
      border: 1px solid rgba(34,197,94,0.5);

      background: rgba(34,197,94,0.12);
    }

    .candidate-row img {
      width: 36px;
      height: 36px;

      border-radius: 50%;

      object-fit: cover;

      margin-right: 10px;
    }

    /* =========================
       MOBILE
    ========================= */

    @media (max-width: 600px) {

      .title {
        font-size: 15px;
      }

      .candidate-image {
        width: 36px;
        height: 36px;
      }

      #sidebar {
        width: 100%;
        right: -100%;
      }

      #header {
        padding: 8px 10px;
      }

    }

  </style>
</head>

<body>

  <!-- LOADER -->
  <div id="loader">
    <div class="spinner"></div>
    <div id="loader-text">
      LOADING ELECTION MAP...
    </div>
  </div>


  <!-- WINNER -->
  <div id="winner-banner">
    <i class="fas fa-check-circle"></i>
    <span id="winner-text"></span>
  </div>


  <!-- HEADER -->
  <div id="header">

    <div class="top-row">

      <div class="title-group">

        <div class="live-badge">
          LIVE
        </div>

        <div class="title">
          2012 ELECTION CENTER
        </div>

      </div>


      <div class="header-controls">

        <button
          class="btn-icon"
          onclick="resetMap()"
          title="Reset Map"
        >
          <i class="fas fa-compress-arrows-alt"></i>
        </button>


        <button
          class="btn-icon"
          onclick="refreshData()"
          title="Reload Map"
        >
          <i class="fas fa-sync-alt"></i>
        </button>


        <button
          class="btn-icon"
          onclick="toggleSidebar()"
          title="State List"
        >
          <i class="fas fa-bars"></i>
        </button>

      </div>

    </div>


    <!-- ELECTORAL BAR -->

    <div class="progress-container">

      <div class="progress-bar-container">

        <img
          src="images/austinwarner2.jpg"
          class="candidate-image"
          alt="Warner"
        >


        <div style="width:100%;">

          <div class="progress-bar-wrapper">

            <div class="progress-bar gop"></div>

            <div class="progress-bar dem"></div>

            <div class="threshold-marker"></div>

          </div>

        </div>


        <img
          src="images/Barack-Obama.webp"
          class="candidate-image"
          alt="Obama"
        >

      </div>


      <div class="candidate-stats">

        <div class="stat-group">

          <span style="color:var(--gop-color)">
            Warner:
            <span
              id="Warner-votes"
              style="font-weight:bold"
            >
              0
            </span>
          </span>

          <span id="Warner-pv">
            0 (0%)
          </span>

        </div>


        <span id="reporting">
          0% REPORTING
        </span>


        <div class="stat-group">

          <span id="Obama-pv">
            0 (0%)
          </span>

          <span style="color:var(--dem-color)">
            Obama:
            <span
              id="Obama-votes"
              style="font-weight:bold"
            >
              0
            </span>
          </span>

        </div>

      </div>

    </div>

  </div>


  <!-- SIDEBAR -->

  <div id="sidebar">

    <div class="sidebar-header">

      <span class="sidebar-title">
        State Results
      </span>

      <button
        class="close-sidebar"
        onclick="toggleSidebar()"
      >
        <i class="fas fa-times"></i>
      </button>

    </div>


    <div class="search-container">

      <input
        type="text"
        id="state-search"
        class="search-input"
        placeholder="Search state..."
        onkeyup="filterStates()"
      >

    </div>


    <ul
      class="state-list"
      id="state-list-ul"
    ></ul>

  </div>


  <!-- MAP -->

  <div id="map"></div>


  <!-- LEGEND -->

  <button
    id="legend-btn"
    onclick="toggleLegend()"
  >
    <i class="fas fa-map"></i>
    Legend
  </button>


  <div id="legend-panel">

    <div style="font-weight:800;margin-bottom:8px">
      ELECTORAL MARGIN
    </div>

    <div class="legend-item">
      <span class="legend-dot" style="background:#c0392b"></span>
      Solid GOP
    </div>

    <div class="legend-item">
      <span class="legend-dot" style="background:#e74c3c"></span>
      Likely GOP
    </div>

    <div class="legend-item">
      <span class="legend-dot" style="background:#f1948a"></span>
      Lean GOP
    </div>

    <div class="legend-item">
      <span class="legend-dot" style="background:#fadbd8"></span>
      Tilt GOP
    </div>

    <div class="legend-item">
      <span class="legend-dot" style="background:#d6eaf8"></span>
      Tilt DEM
    </div>

    <div class="legend-item">
      <span class="legend-dot" style="background:#85c1e9"></span>
      Lean DEM
    </div>

    <div class="legend-item">
      <span class="legend-dot" style="background:#3498db"></span>
      Likely DEM
    </div>

    <div class="legend-item">
      <span class="legend-dot" style="background:#2980b9"></span>
      Solid DEM
    </div>

    <div class="legend-item">
      <span class="legend-dot" style="background:#95a5a6"></span>
      Tossup
    </div>

  </div>


  <!-- TICKER -->

  <div id="ticker-bar">

    <div class="ticker-label">
      KEY RACES
    </div>

    <div class="ticker-wrap">

      <div
        class="ticker-content"
        id="ticker-content"
      ></div>

    </div>

  </div>


<script>

  /* ============================================================
     CONFIGURATION
  ============================================================ */

  const CANDIDATE_GOP = 'Austin Warner';
  const CANDIDATE_DEM = 'Barack Obama';

  const WIN_NUMBER = 270;
  const TOTAL_EV = 538;


  /*
    LOCAL GEOJSON FILE

    Put states.geojson in the SAME folder as index.html

    No Google Sheets.
    No Apps Script.
    No API token.
  */

  const GEOJSON_URL = './states.geojson';


  /* ============================================================
     STATE
  ============================================================ */

  let electionGeoJSON = null;
  let isWinnerDeclared = false;


  /* ============================================================
     DOM
  ============================================================ */

  const loader =
    document.getElementById('loader');

  const loaderText =
    document.getElementById('loader-text');

  const winnerBanner =
    document.getElementById('winner-banner');

  const winnerText =
    document.getElementById('winner-text');

  const sidebar =
    document.getElementById('sidebar');

  const stateListUl =
    document.getElementById('state-list-ul');

  const tickerContent =
    document.getElementById('ticker-content');


  /* ============================================================
     MAPLIBRE + OPENFREEMAP
  ============================================================ */

  const map = new maplibregl.Map({

    container: 'map',

    style:
      'https://tiles.openfreemap.org/styles/dark',

    center: [-98.5, 39.8],

    zoom: 3.5,

    attributionControl: true

  });


  map.addControl(
    new maplibregl.NavigationControl(),
    'top-right'
  );


  /* ============================================================
     MAP LOAD
  ============================================================ */

  map.on('load', async () => {

    await loadLocalGeoJSON();

  });


  /* ============================================================
     LOAD LOCAL GEOJSON
  ============================================================ */

  async function loadLocalGeoJSON() {

    loader.style.display = 'flex';

    loader.style.opacity = '1';

    loaderText.innerText =
      'LOADING ELECTION MAP...';


    try {

      const response =
        await fetch(GEOJSON_URL);


      if (!response.ok) {

        throw new Error(
          `Could not load ${GEOJSON_URL}`
        );

      }


      const data =
        await response.json();


      electionGeoJSON = data;


      processData(data);


      if (map.getSource('states')) {

        map
          .getSource('states')
          .setData(data);

      }

      else {

        initMapLayers(data);

        setupMapEvents();

      }


      loader.style.opacity = '0';


      setTimeout(() => {

        loader.style.display = 'none';

      }, 500);


    }

    catch (error) {

      console.error(
        'GeoJSON Load Error:',
        error
      );


      loaderText.innerHTML = `

        <strong>
          FAILED TO LOAD states.geojson
        </strong>

        <br><br>

        Make sure your folder contains:

        <br><br>

        index.html<br>
        states.geojson

      `;

    }

  }


  /*
    This keeps the refresh button.

    But now it reloads states.geojson
    instead of Google Sheets.
  */

  function refreshData() {

    const icon =
      document.querySelector('.fa-sync-alt');


    if (icon) {

      icon.classList.add('fa-spin');

    }


    loadLocalGeoJSON()
      .finally(() => {

        setTimeout(() => {

          if (icon) {

            icon.classList.remove('fa-spin');

          }

        }, 800);

      });

  }


  /* ============================================================
     MAP EVENTS
  ============================================================ */

  function setupMapEvents() {

    const hoverPopup =
      new maplibregl.Popup({

        closeButton: false,

        closeOnClick: false

      });


    map.on(
      'mousemove',
      'states-fill',
      event => {

        map
          .getCanvas()
          .style
          .cursor = 'pointer';


        const p =
          event.features[0].properties;


        hoverPopup
          .setLngLat(event.lngLat)
          .setHTML(`

            <div style="
              padding:8px 12px;
              font-weight:800;
              font-size:12px;
            ">
              ${p.NAME || p.name || 'Unknown'}
            </div>

          `)
          .addTo(map);

      }
    );


    map.on(
      'mouseleave',
      'states-fill',
      () => {

        map
          .getCanvas()
          .style
          .cursor = '';


        hoverPopup.remove();

      }
    );


    map.on(
      'click',
      'states-fill',
      event => {

        const p =
          event.features[0].properties;


        new maplibregl.Popup({

          offset: 25

        })
        .setLngLat(event.lngLat)
        .setHTML(
          createPopupHTML(p)
        )
        .addTo(map);

      }
    );

  }


  /* ============================================================
     PROCESS ELECTION DATA
  ============================================================ */

  function processData(data) {

    let gopEV = 0;
    let demEV = 0;

    let gopPV = 0;
    let demPV = 0;

    let totalPV = 0;

    let totalExpected = 0;


    const stateListItems = [];


    data.features.forEach(feature => {

      const p =
        feature.properties;


      /*
        Your GeoJSON should ideally contain:

        NAME
        abbr
        votes_gop
        votes_dem
        votes_ind
        reporting
        electoral_votes
      */


      const name =
        p.NAME ||
        p.name ||
        'Unknown';


      const gop =
        Number(p.votes_gop) || 0;


      const dem =
        Number(p.votes_dem) || 0;


      const ind =
        Number(p.votes_ind) || 0;


      const reporting =
        Number(p.reporting) || 0;


      const electoralVotes =
        Number(p.electoral_votes) || 0;


      const total =
        gop + dem + ind;


      gopPV += gop;
      demPV += dem;

      totalPV += total;


      if (reporting > 0) {

        totalExpected +=
          total / (reporting / 100);

      }


      let leader = 'Tossup';

      let margin = 0;

      let status = 'Uncalled';


      if (total > 0) {

        margin =
          Math.abs(gop - dem) /
          total;


        if (gop > dem) {

          leader = 'GOP';

        }

        else if (dem > gop) {

          leader = 'DEM';

        }


        if (reporting === 100) {

          status =
            `Solid ${leader}`;

        }

        else if (margin >= 0.10) {

          status =
            `Solid ${leader}`;

        }

        else if (margin >= 0.05) {

          status =
            `Likely ${leader}`;

        }

        else if (margin >= 0.02) {

          status =
            `Lean ${leader}`;

        }

        else if (margin > 0) {

          status =
            `Tilt ${leader}`;

        }

        else {

          status =
            'Tossup';

        }

      }


      /*
        Save calculated data
        directly into GeoJSON properties.
      */

      p.status = status;

      p.leader = leader;

      p.margin = margin;


      /*
        Electoral Votes

        Only counted once
        the state reaches 100% reporting.
      */

      if (reporting === 100) {

        if (leader === 'GOP') {

          gopEV += electoralVotes;

        }

        else if (leader === 'DEM') {

          demEV += electoralVotes;

        }

      }


      stateListItems.push({

        name: name,

        margin: total > 0
          ? margin
          : 999,

        leader: leader,

        reporting: reporting,

        gopV: gop,

        demV: dem,

        electoralVotes: electoralVotes,

        geometry: feature.geometry

      });

    });


    updateHeader(

      gopEV,

      demEV,

      gopPV,

      demPV,

      totalPV,

      totalExpected

    );


    checkWinner(
      gopEV,
      demEV
    );


    populateSidebar(
      stateListItems
    );


    populateTicker(
      stateListItems
    );

  }


  /* ============================================================
     CREATE MAP LAYERS
  ============================================================ */

  function initMapLayers(data) {

    map.addSource(
      'states',
      {

        type: 'geojson',

        data: data

      }
    );


    map.addLayer({

      id: 'states-fill',

      type: 'fill',

      source: 'states',

      paint: {

        'fill-color': [

          'match',

          ['get', 'status'],

          'Solid GOP',
          '#c0392b',

          'Likely GOP',
          '#e74c3c',

          'Lean GOP',
          '#f1948a',

          'Tilt GOP',
          '#fadbd8',

          'Solid DEM',
          '#2980b9',

          'Likely DEM',
          '#3498db',

          'Lean DEM',
          '#85c1e9',

          'Tilt DEM',
          '#d6eaf8',

          'Tossup',
          '#95a5a6',

          'Uncalled',
          '#34495e',

          '#34495e'

        ],

        'fill-opacity': 0.82

      }

    });


    map.addLayer({

      id: 'states-line',

      type: 'line',

      source: 'states',

      paint: {

        'line-color':
          'rgba(255,255,255,0.45)',

        'line-width':
          1

      }

    });

  }


  /* ============================================================
     HEADER UPDATE
  ============================================================ */

  function updateHeader(

    gopEV,
    demEV,

    gopPV,
    demPV,

    totalPV,
    totalExpected

  ) {

    animateValue(
      'Warner-votes',
      Number(
        document
          .getElementById('Warner-votes')
          .innerText
      ),
      gopEV,
      600
    );


    animateValue(
      'Obama-votes',
      Number(
        document
          .getElementById('Obama-votes')
          .innerText
      ),
      demEV,
      600
    );


    const gopPercent =
      totalPV > 0
        ? ((gopPV / totalPV) * 100)
            .toFixed(1)
        : '0.0';


    const demPercent =
      totalPV > 0
        ? ((demPV / totalPV) * 100)
            .toFixed(1)
        : '0.0';


    document
      .getElementById('Warner-pv')
      .innerText =

      `${gopPV.toLocaleString()} (${gopPercent}%)`;


    document
      .getElementById('Obama-pv')
      .innerText =

      `${demPV.toLocaleString()} (${demPercent}%)`;


    const reportingPercent =
      totalExpected > 0

        ? Math.min(
            100,
            (totalPV / totalExpected) * 100
          ).toFixed(1)

        : '0.0';


    document
      .getElementById('reporting')
      .innerText =

      `${reportingPercent}% REPORTING`;


    const gopWidth =
      (gopEV / TOTAL_EV) * 100;


    const demWidth =
      (demEV / TOTAL_EV) * 100;


    document
      .querySelector('.progress-bar.gop')
      .style
      .width =

      `${gopWidth}%`;


    document
      .querySelector('.progress-bar.dem')
      .style
      .width =

      `${demWidth}%`;

  }


  /* ============================================================
     SIDEBAR
  ============================================================ */

  function populateSidebar(states) {

    states.sort(
      (a, b) =>
        a.margin - b.margin
    );


    stateListUl.innerHTML = '';


    states.forEach(state => {

      let marginClass =
        'margin-tossup';


      if (
        state.leader === 'GOP'
      ) {

        marginClass =
          'margin-gop';

      }


      if (
        state.leader === 'DEM'
      ) {

        marginClass =
          'margin-dem';

      }


      const marginText =
        state.margin === 999

          ? '--'

          : `+${
              (
                state.margin * 100
              ).toFixed(1)
            }%`;


      const item =
        document.createElement('li');


      item.className =
        'state-item';


      item.dataset.name =
        state.name.toLowerCase();


      item.innerHTML = `

        <div>

          <span class="state-name">
            ${state.name}
          </span>

          <span class="state-meta">

            ${state.reporting}% In

            •

            ${state.leader}

          </span>

        </div>


        <div class="
          state-margin
          ${marginClass}
        ">

          ${marginText}

        </div>

      `;


      item.onclick = () => {

        zoomToState(
          state.name
        );

      };


      stateListUl.appendChild(
        item
      );

    });

  }


  /* ============================================================
     ZOOM TO STATE
  ============================================================ */

  function zoomToState(name) {

    if (!electionGeoJSON) {
      return;
    }


    const feature =
      electionGeoJSON.features.find(
        f =>
          (
            f.properties.NAME ||
            f.properties.name
          ) === name
      );


    if (!feature) {
      return;
    }


    const bounds =
      new maplibregl.LngLatBounds();


    extendBounds(
      bounds,
      feature.geometry.coordinates
    );


    map.fitBounds(
      bounds,
      {
        padding: 100,
        maxZoom: 6
      }
    );


    if (
      window.innerWidth < 600
    ) {

      toggleSidebar();

    }

  }


  /*
    Works with both Polygon
    and MultiPolygon GeoJSON.
  */

  function extendBounds(
    bounds,
    coordinates
  ) {

    if (
      typeof coordinates[0] === 'number'
    ) {

      bounds.extend(coordinates);

      return;

    }


    coordinates.forEach(
      coordinate =>
        extendBounds(
          bounds,
          coordinate
        )
    );

  }


  /* ============================================================
     TICKER
  ============================================================ */

  function populateTicker(states) {

    const closeRaces =
      states
        .filter(
          state =>
            state.margin < 0.05 &&
            state.margin !== 999
        )
        .slice(0, 12);


    let html = '';


    closeRaces.forEach(state => {

      let color = 'white';


      if (
        state.leader === 'GOP'
      ) {

        color =
          'var(--gop-color)';

      }


      if (
        state.leader === 'DEM'
      ) {

        color =
          'var(--dem-color)';

      }


      html += `

        <span class="ticker-item">

          <strong style="
            color:${color}
          ">

            ${state.name}

          </strong>

          ${state.leader}

          +${(
            state.margin * 100
          ).toFixed(1)}%

        </span>

      `;

    });


    if (!html) {

      html = `

        <span class="ticker-item">

          Waiting for election data...

        </span>

      `;

    }


    tickerContent.innerHTML =
      html + html;

  }


  /* ============================================================
     WINNER
  ============================================================ */

  function checkWinner(
    gopEV,
    demEV
  ) {

    if (
      isWinnerDeclared
    ) {

      return;

    }


    let winner = null;


    if (
      gopEV >= WIN_NUMBER
    ) {

      winner =
        CANDIDATE_GOP;

    }


    if (
      demEV >= WIN_NUMBER
    ) {

      winner =
        CANDIDATE_DEM;

    }


    if (winner) {

      isWinnerDeclared = true;


      winnerText.innerText =
        `PROJECTED WINNER: ${winner}`;


      winnerBanner.style.top =
        '0';


      fireConfetti();

    }

  }


  /* ============================================================
     POPUP
  ============================================================ */

  function createPopupHTML(p) {

    const name =
      p.NAME ||
      p.name ||
      'Unknown';


    const gop =
      Number(p.votes_gop) || 0;


    const dem =
      Number(p.votes_dem) || 0;


    const total =
      gop + dem;


    const gopPercent =
      total > 0

        ? (
            gop / total * 100
          ).toFixed(1)

        : '0.0';


    const demPercent =
      total > 0

        ? (
            dem / total * 100
          ).toFixed(1)

        : '0.0';


    return `

      <div class="popup-header">

        <h3>
          ${name}
        </h3>

        <div style="
          font-size:12px;
          opacity:0.7;
        ">

          ${
            p.electoral_votes || 0
          }
          Electoral Votes

          •

          ${
            p.reporting || 0
          }% Reporting

        </div>

      </div>


      <div class="popup-body">


        <div class="
          candidate-row
          ${
            gop > dem
              ? 'winner'
              : ''
          }
        ">

          <img
            src="images/austinwarner2.jpg"
          >

          <div style="flex:1">

            <strong>
              Warner
            </strong>

            <br>

            <small>
              ${gop.toLocaleString()}
            </small>

          </div>


          <strong>
            ${gopPercent}%
          </strong>

        </div>


        <div class="
          candidate-row
          ${
            dem > gop
              ? 'winner'
              : ''
          }
        ">

          <img
            src="images/Barack-Obama.webp"
          >

          <div style="flex:1">

            <strong>
              Obama
            </strong>

            <br>

            <small>
              ${dem.toLocaleString()}
            </small>

          </div>


          <strong>
            ${demPercent}%
          </strong>

        </div>


        <div style="
          text-align:center;
          margin-top:10px;
          font-size:12px;
          color:#9ca3af;
        ">

          Status:
          ${p.status || 'Uncalled'}

        </div>

      </div>

    `;

  }


  /* ============================================================
     BUTTONS
  ============================================================ */

  function toggleSidebar() {

    sidebar.classList.toggle(
      'open'
    );

  }


  function toggleLegend() {

    document
      .getElementById('legend-panel')
      .classList.toggle(
        'show'
      );

  }


  function filterStates() {

    const search =
      document
        .getElementById('state-search')
        .value
        .toLowerCase();


    document
      .querySelectorAll('.state-item')
      .forEach(item => {

        item.classList.toggle(

          'hidden',

          !item.dataset.name.includes(
            search
          )

        );

      });

  }


  function resetMap() {

    map.flyTo({

      center:
        [-98.5, 39.8],

      zoom:
        3.5

    });

  }


  /* ============================================================
     NUMBER ANIMATION
  ============================================================ */

  function animateValue(
    id,
    start,
    end,
    duration
  ) {

    const element =
      document.getElementById(id);


    if (start === end) {

      element.innerText =
        end.toLocaleString();

      return;

    }


    let startTime = null;


    function animate(time) {

      if (!startTime) {

        startTime = time;

      }


      const progress =
        Math.min(
          (time - startTime) /
          duration,
          1
        );


      const value =
        Math.floor(

          start +
          (end - start) *
          progress

        );


      element.innerText =
        value.toLocaleString();


      if (progress < 1) {

        requestAnimationFrame(
          animate
        );

      }

    }


    requestAnimationFrame(
      animate
    );

  }


  /* ============================================================
     CONFETTI
  ============================================================ */

  function fireConfetti() {

    confetti({

      particleCount: 200,

      spread: 100,

      origin: {
        y: 0.6
      }

    });

  }

</script>
